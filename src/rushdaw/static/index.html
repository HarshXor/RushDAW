<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RushDAW</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="logo">Rush<span>DAW</span></div>
  <div class="group transport">
    <button id="btnRewind" class="sq" title="Back to start (Home)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5l-10 7 10 7z" fill="currentColor" stroke="none"/><path d="M6 5v14"/></svg></button>
    <button id="btnPlay" class="sq" title="Play / Stop (Space)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></svg></button>
    <button id="btnRecord" class="sq rec" title="Record on armed track (R)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="currentColor" stroke="none"/></svg></button>
    <div id="timeDisplay">1.1.1 | 00:00.000</div>
  </div>
  <div class="group tempo">
    <label class="fld">BPM <input id="bpm" type="number" min="40" max="240" value="180"></label>
    <label class="fld">Sig <select id="sig"><option>4</option><option>3</option><option>6</option></select><span class="unit">/4</span></label>
  </div>
  <div class="group toggles">
    <label class="toggle"><input id="metronome" type="checkbox" checked> Metronome</label>
    <label class="toggle"><input id="metroPlay" type="checkbox"> Click on play</label>
    <label class="toggle"><input id="countIn" type="checkbox" checked> Count-in</label>
    <label class="toggle" title="Snap regions / clips to the fine ruler ticks (the grid follows the zoom: 1/16, 1/8 or 1/4 note)"><input id="snap" type="checkbox" checked> Snap <span id="snapGrid" class="snapgrid">1/16</span></label>
    <label class="toggle"><input id="loop" type="checkbox"> Loop</label>
    <label class="fld zoom">Zoom <input id="zoom" type="range" min="10" max="300" value="60"></label>
  </div>
  <div class="group export">
    <select id="exportFmt" title="Export format"><option value="wav">WAV</option></select>
    <label class="toggle" title="Off = export sounds exactly like playback in the studio. On = raise the level to the master ceiling."><input id="normalize" type="checkbox"> Normalize</label>
    <button id="btnExport" class="primary" title="Export the song"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg><span class="tx">Export</span></button>
  </div>
  <div class="group add">
    <button id="addAudio"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="tx">Audio</span></button>
    <button id="addDrum"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="tx">Drum</span></button>
    <button id="addSynth"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="tx">Synth</span></button>
    <button id="addGuitar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="tx">Guitar</span></button>
    <button id="addBass"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="tx">Bass</span></button>
    <button id="addVoice" title="MIDI voice: choir / solo hooo, haaa – long notes sustain"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="tx">Vocal MIDI</span></button>
    <button id="btnImport" title="Import audio / video files"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v4h14v-4"/></svg><span class="tx">Import…</span></button>
  </div>
  <div class="group edit">
    <button id="btnUndo" title="Undo (Ctrl/Cmd+Z)" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 4.5 10 9 14.5"/><path d="M5 10h9a5 5 0 0 1 0 10h-2"/></svg><span class="tx">Undo</span></button>
    <button id="btnRedo" title="Redo (Ctrl/Cmd+Shift+Z · Ctrl+Y)" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5.5 4.5 4.5-4.5 4.5"/><path d="M19 10h-9a5 5 0 0 0 0 10h2"/></svg><span class="tx">Redo</span></button>
    <button id="btnCopy" title="Copy selected clip(s) / track / drum part (Ctrl/Cmd+C)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></svg><span class="tx">Copy</span></button>
    <button id="btnCut" title="Cut (Ctrl/Cmd+X)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M8.3 15.7 19 4M15.7 15.7 5 4"/></svg><span class="tx">Cut</span></button>
    <button id="btnPaste" title="Paste (Ctrl/Cmd+V) – clips at the playhead, tracks below the selected track"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3.5h6V5"/><path d="M9 11h6M9 15h4"/></svg><span class="tx">Paste</span></button>
    <input id="fileInput" type="file" accept="audio/*,video/*" multiple hidden>
  </div>
  <div class="group project">
    <button id="btnProjects" title="Back to project manager (auto-saves changes)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="tx">Projects</span></button>
    <input id="title" value="My Song" title="Project / song title">
    <input id="revMsg" placeholder="Revision note (optional)" title="Note stored with the next saved revision">
    <button id="btnSave" title="Save a new revision (Ctrl/Cmd+S)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span class="tx">Save</span></button>
    <button id="btnHistory" title="Revision history"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg><span class="tx">History</span></button>
    <span id="dirtyDot" title="Unsaved changes"></span>
  </div>
</header>

<main id="arrange">
  <div id="headers">
    <div class="ruler-spacer"></div>
    <div id="trackHeaders"></div>
  </div>
  <div id="timelineWrap">
    <div id="timeline">
      <div id="ruler" title="Click: move playhead · Shift+drag: set loop"></div>
      <div id="lanes"></div>
      <div id="loopRegion"></div>
      <div id="playhead"></div>
    </div>
  </div>
</main>

<div id="splitter" title="Drag to resize the panel"></div>
<section id="bottom">
  <nav class="tabs">
    <button data-tab="mixer" class="active">Mixer</button>
    <button data-tab="editor">Editor</button>
    <button data-tab="fx">Effects</button>
    <button data-tab="master">Mastering</button>
    <span id="status"></span>
  </nav>
  <div id="tab-mixer" class="tab active"><div id="mixer"></div></div>
  <div id="tab-editor" class="tab"><div id="editor"><p class="hint">Select a Drum or Synth track to edit its pattern.</p></div></div>
  <div id="tab-fx" class="tab"><div id="fxPanel"></div></div>
  <div id="tab-master" class="tab"><div id="master"></div></div>
</section>

<div id="dropOverlay">Drop audio files to import</div>

<!-- project manager (start screen) -->
<section id="home">
  <div class="home-inner">
    <header class="home-head">
      <div class="logo big">Rush<span>DAW</span></div>
      <div class="home-path" id="homePath"></div>
    </header>
    <div class="home-new">
      <h3>New project</h3>
      <div class="row">
        <input id="npName" placeholder="Project name" value="New Song">
        <label>BPM <input id="npBpm" type="number" min="40" max="240" value="180"></label>
        <label>Template <select id="npTpl"><option value="demo">Metal demo (drums, bass, guitar)</option><option value="band">Band (drums, bass, guitar, vocal)</option><option value="dbeat">D-Beat / Crust Punk (d-beat drums, pick bass, distorted guitar)</option><option value="empty">Empty</option></select></label>
        <button id="npCreate" class="primary">+ Create</button>
        <button id="npImport" title="Import a .rushdaw file as a new project">Import .rushdaw…</button>
        <input id="npImportFile" type="file" accept=".rushdaw,.json" hidden>
      </div>
    </div>
    <div class="home-bar">
      <h3 id="homeTitle">Projects</h3>
      <input id="projSearch" placeholder="Search…">
      <button id="btnTrash">🗑 Trash</button>
    </div>
    <div id="projList"></div>
  </div>
</section>

<!-- revision history dialog -->
<div id="historyDlg" class="dlg">
  <div class="dlg-box">
    <div class="dlg-head"><b id="historyTitle">History</b><button id="historyClose">✕</button></div>
    <div id="historyList"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
